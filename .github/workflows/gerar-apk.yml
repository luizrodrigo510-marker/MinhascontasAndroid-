
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'MinhasContasAndroid-Projeto-Celular.zip'
      - '.github/workflows/gerar-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: unzip -q MinhasContasAndroid-Projeto-Celular.zip -d .

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: MinhasContasAndroid
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MinhasContas-APK
          path: MinhasContasAndroid/app/build/outputs/apk/debug/app-debug.apk
          
